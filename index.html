<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Optimized viewport meta for native app touch response -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aathira Golden City - Interactive Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --color-available: #22c55e;
      --color-available-hover: #16a34a;
      --color-sold: #ef4444;
      --color-sold-text: #dc2626;
      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-primary: #2563eb;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body { 
      height: 100%; 
      width: 100%;
      overflow: hidden; 
      background: #ffffff;
      touch-action: manipulation;
    }

    #map { 
      height: 100%; 
      width: 100%; 
      background: #ffffff; 
    }

    .leaflet-overlay-pane svg path { shape-rendering: crispEdges; }

    /* Pop-up Overlay Modal - Mobile Bottom Sheet Style */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.65);
      z-index: 9999;
      justify-content: center;
      align-items: flex-end; /* Slides up from bottom on mobile */
      padding: 0;
    }

    @media (min-width: 640px) {
      .modal-overlay {
        align-items: center;
        padding: 16px;
      }
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      background: #ffffff;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.15);
      overflow-y: auto;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: slideUp 0.25s ease-out;
    }

    @media (min-width: 640px) {
      .modal-card {
        border-radius: 12px;
        animation: fadeIn 0.2s ease-out;
      }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-main);
    }

    /* Increased touch target size for mobile */
    .modal-close-btn {
      background: #f1f5f9;
      color: var(--color-text-muted);
      border: none;
      font-size: 20px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close-btn:active {
      background: #ef4444;
      color: white;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #f1f5f9;
      font-size: 14px;
    }

    .detail-item span:first-child { color: var(--color-text-muted); }
    .detail-item span:last-child { font-weight: 600; color: var(--color-text-main); text-align: right; }

    /* Mobile PDF Link Button */
    .btn-pdf-view {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: var(--color-text-main);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 8px;
    }

    .btn-contact {
      min-height: 48px; /* Touch friendly minimum height */
      padding: 12px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }

    .btn-contact:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .leaflet-tooltip.circle-label {
      background: transparent;
      border: none;
      box-shadow: none;
      color: #ffffff;
      font-weight: bold;
      font-size: 11px;
      padding: 0;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Mobile Bottom Sheet Pop-Up Modal -->
  <div class="modal-overlay" id="info-modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-plot-title">Plot Information</h2>
        <button class="modal-close-btn" onclick="closeModal()" aria-label="Close Modal">✕</button>
      </div>

      <div id="modal-details-container">
        <!-- Plot details injected here -->
      </div>

      <button class="btn-contact" id="action-btn" disabled>Inquire Plot</button>
    </div>
  </div>

  <!-- Leaflet JS & Custom Data File -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="plots-data-polygon.js"></script>
  
  <script>
    const COLORS = {
      available: '#22c55e',
      availableHover: '#16a34a',
      sold: '#ef4444',
      soldText: '#dc2626',
      borderColor: '#000000'
    };

    const isMobile = window.innerWidth <= 768;
    const imgWidth = 1920, imgHeight = 1080;
    
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1,
      maxZoom: 3,
      maxBoundsViscosity: 0.8,
      tap: true, // Optimised for touch devices
      bounceAtZoomLimits: false
    });

    L.imageOverlay('Aathira-Golden-City-Plots.svg', [[0, 0], [imgHeight, imgWidth]]).addTo(map);

    const initialZoom = isMobile ? -1 : -0.5;
    map.setView([imgHeight / 2, imgWidth / 2], initialZoom);

    const modal = document.getElementById('info-modal');
    const modalTitle = document.getElementById('modal-plot-title');
    const modalDetails = document.getElementById('modal-details-container');
    const btn = document.getElementById('action-btn');

    // Efficient CSS Variable zoom handler (prevents DOM recalculation thrashing)
    function updateLabelFontSize() {
      const zoom = map.getZoom();
      const calculatedSize = Math.max(8, Math.round(12 * Math.pow(1.4, zoom)));
      document.documentElement.style.setProperty('--label-font-size', `${calculatedSize}px`);
    }

    map.on('zoomend', updateLabelFontSize);

    initMap(configData);

    function initMap({ defaultPlotData, plotDetails }) {
      for (let plotNum = 1; plotNum <= 126; plotNum++) {
        const plotData = { ...defaultPlotData, ...(plotDetails[plotNum] || {}) };
        const { x, y } = plotData;
        const isSold = plotData.status === "Sold";
        const plotLabel = plotData.label || `${plotNum}`;

        let polygonBounds;

        if (plotData.corners && Array.isArray(plotData.corners)) {
          polygonBounds = plotData.corners;
        } else if (x != null && y != null) {
          const width = plotData.polyWidth ?? defaultPlotData.polyWidth;
          const height = plotData.polyHeight ?? defaultPlotData.polyHeight;

          const halfWidth = width / 2;
          const halfHeight = height / 2;

          polygonBounds = [
            [y - halfHeight, x - halfWidth],
            [y + halfHeight, x - halfWidth],
            [y + halfHeight, x + halfWidth],
            [y - halfHeight, x + halfWidth]
          ];
        } else {
          continue;
        }

        const polygon = L.polygon(polygonBounds, {
          color: plotData.borderColor || COLORS.borderColor,
          weight: 2,
          fillColor: isSold ? COLORS.sold : COLORS.available,
          fillOpacity: 1
        }).addTo(map);

        polygon.bindTooltip(plotLabel, {
          permanent: true,
          direction: 'center',
          className: 'circle-label'
        });

        // Touch desktop fallback separation
        if (!isMobile) {
          polygon.on('mouseover', function () {
            this.setStyle({ fillColor: isSold ? COLORS.sold : COLORS.availableHover, weight: 3 });
          });
          polygon.on('mouseout', function () {
            this.setStyle({ fillColor: isSold ? COLORS.sold : COLORS.available, weight: 2 });
          });
        }

        polygon.on('click', () => openPlotModal(plotNum, plotData));
      }

      updateLabelFontSize();
    }

    function openPlotModal(plotId, data) {
      const isAvailable = data.status === "Available";
      const statusColor = isAvailable ? COLORS.availableHover : COLORS.soldText;
      const displayLabel = data.label || `Plot #${plotId}`;

      // Relative web path for production deployment
      const dynamicPdfFile = data.fmbLink || data.pdfFile || `fmb/agc_fmb_1A${data.label || plotId}.pdf`;

      modalTitle.innerText = displayLabel;

      const fields = [
        ['Status', `<span style="color: ${statusColor};">${data.status}</span>`],
        ['Area Size', data.size],
        ['Length x Breadth', `${data.length} x ${data.breadth}`],
        ['Price', data.price],
        ['Rate', data.rate],
        ['Facing', data.facing],
        ['Road Width', data.roadWidth],
        ['Corner Plot', data.cornerPlot]
      ];

      const detailsHTML = fields
        .map(([label, value]) => `<div class="detail-item"><span>${label}</span><span>${value}</span></div>`)
        .join('');

      // Mobile friendly document trigger instead of embedded iframe
      const pdfMarkup = isMobile 
        ? `<a href="${dynamicPdfFile}" target="_blank" class="btn-pdf-view">📄 View FMB Document (PDF)</a>`
        : `<iframe src="${dynamicPdfFile}#toolbar=0" class="plot-pdf-frame" title="${displayLabel} PDF"></iframe>`;

      modalDetails.innerHTML = `
        <div>
          ${detailsHTML}
          <div style="margin-top: 10px;">
            ${pdfMarkup}
          </div>
        </div>
      `;

      btn.disabled = !isAvailable;
      btn.innerText = isAvailable ? `Inquire About ${displayLabel}` : "Plot Sold";

      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' || e.key === 'Esc') {
        closeModal();
      }
    });
  </script>
</body>
</html>
